[project]
name = "rigol-oscilloscope-mcp"
version = "0.1.0"
description = "Rigol製オシロスコープをSCPI経由で操作するMCPサーバー"
readme = "docs/README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1,<2",
    "pyyaml",
    "pillow",
    "pyvisa",
    "pyvisa-py",
]

[project.scripts]
rigol-oscilloscope-mcp = "rigol_oscilloscope_mcp.__main__:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rigol_oscilloscope_mcp"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
markers = [
    "device: 実機が必要なテスト",
    "device_write: 実機に書き込むテスト",
]
