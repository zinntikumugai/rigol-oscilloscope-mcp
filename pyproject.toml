[project]
name = "rigol-oscilloscope-mcp"
version = "0.1.3"
description = "MCP server for controlling RIGOL oscilloscopes over SCPI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zinntikumugai" }]
keywords = ["mcp", "oscilloscope", "rigol", "scpi", "test-equipment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1,<2",
    "pyyaml",
    "pillow",
    "pyvisa",
    "pyvisa-py",
]

[project.urls]
Repository = "https://github.com/zinntikumugai/rigol-oscilloscope-mcp"
Issues = "https://github.com/zinntikumugai/rigol-oscilloscope-mcp/issues"

[project.scripts]
rigol-oscilloscope-mcp = "rigol_oscilloscope_mcp.__main__:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rigol_oscilloscope_mcp"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
markers = [
    "device: test that requires real hardware",
    "device_write: test that writes to real hardware",
]
