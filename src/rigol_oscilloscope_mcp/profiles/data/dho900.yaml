# ガイドベースプロファイル: DHO900シリーズ(docs/device-profiles.md 6章)
# 出典: DHO800/DHO900 Programming Guide PGA39106-1110(dho800.yaml と同一)
# **実機未検証**(confidence: guide)。SCPIはDHO800と同一系統のため差分のみ宣言する。
# DHO914S/924S は1chのAFGを内蔵するが、DHO系のジェネレータは番号なし `:SOURce`
# (MHO900の `:SOURce<n>` とは別方言)で実機未検証のため afg_* は未宣言。
# LAデコード・オプション照会も同様に未宣言 — 不在がそのままゲート
model: DHO900 # ラインナップ: DHO914 / DHO914S / DHO924 / DHO924S(全て4ch)
match: "^DHO9[0-9]{2}"
inherits: dho800
confidence: guide

capabilities:
  analog_channels: 4
  digital_channels: 16 # D0-D15(シリーズ全体で搭載。LA操作自体は未実装)
  # 内蔵ジェネレータはS型(DHO914S/924S)のみ搭載・1ch。搭載有無は実行時に
  # dialect の afg_presence_query で照会する(下記)
  afg_channels: 1

dialect:
  # 内蔵ジェネレータ(DHO800/900ガイド3.25)。**番号なし :SOURce**(MHO900の
  # :SOURce<n> とは別方言)。インピーダンス設定・変調(:MOD)配下は本ガイドの
  # 範囲で未検証のため未宣言(不在=ゲート)。振幅<amp>の単位はガイド上 V 表記で
  # Vppかどうか未確認(要実機検証)
  afg_prefix: ":SOURce"
  afg_waveforms:
    sine: SINusoid
    square: SQUare
    ramp: RAMP
    dc: DC
    noise: NOISe
    arb: ARB
  # ガイド3.24.14: DGモジュール(=ジェネレータ)搭載有無の照会。0なら
  # AFGコマンドを1つも送らず UNSUPPORTED_FEATURE(S型以外の安全ゲート)
  afg_presence_query: ":SYSTem:DGSTatus?"
