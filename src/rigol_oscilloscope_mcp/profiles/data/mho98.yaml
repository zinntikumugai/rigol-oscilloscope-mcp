# 検証済みプロファイル: MHO98(docs/device-profiles.md 3章)
# 実測根拠: docs/verification/mho98-phase0.md(firmware 00.01.00)
model: MHO98
match: "^MHO9[0-9]" # IDNモデル文字列の一致規則(完全一致系)
inherits: rigol-generic
confidence: verified

capabilities:
  analog_channels: 4
  digital_channels: 16
  afg_channels: 2
  protocol_decode: true
  decode_buses: 4 # :BUS1〜:BUS4(実測: :BUS4:MODE? まで応答、:BUS5 は沈黙)
  waveform_download: true
  screenshot: true
  impedance_control: true # :CHANnel<n>:IMPedance が使える(問い合わせ含む)
  impedance_50ohm: true
  measurements:
    [frequency, period, vpp, vmax, vmin, vavg, rms, duty, rise_time, fall_time]

dialect:
  screenshot_command: ":DISPlay:DATA?"
  screenshot_timeout_s: 30 # 約97KBの転送猶予(通常問い合わせの5秒では足りない)
  bwlimit_on: "20M" # 帯域制限「入」の値(選択肢 OFF/20M/100M/250M は要実機確認)
  # オートセットアップ(ガイド3.2.1)。:AUToscale ではない(MHO900では
  # :SYSTem:AUToscale というAUTOキー有効化スイッチしか存在しない)。
  # サブツリー実在は読み取りプローブで実機確認済み(mho98-autoset.md)。
  # autoset書き込み自体は実機実行禁止のため未検証
  autoset_command: ":AUToset"
  # Resultビューの全測定項目を消す(ガイド3.17.3、引数なし・全消しのみ)。実機検証:
  # docs/verification/mho98-measure-clear.md。DHO800/900系は同義の :MEASure:CLEar
  # (ニモニックがファミリで分岐するためdialect化。MHO98実機は両方受理する)
  measurement_clear: ":MEASure:DELete"
  measurement_items:
    frequency: FREQuency
    period: PERiod
    vpp: VPP
    vmax: VMAX
    vmin: VMIN
    vavg: VAVG # VAVerage は不可(実測)
    rms: VRMS
    duty: PDUTy # 返却単位は比率(0.5002 = 50.02%)
    rise_time: RTIMe
    fall_time: FTIMe
  # シリアルデコード(:BUS<n>:MODE の値)。標準搭載6種のみ。
  # i2s(IIS)/ flexray / m1553(AERO)/ CAN-FD はライセンスオプション必須の
  # ため意図的に不在 — **不在がそのままゲート**(4.2の原則)。
  # 実機検証: docs/verification/mho98-unlicensed.md 3章(未ライセンス状態で
  # RS232/IIC/SPI/CAN/LIN/PAR の読み書きが全て正常応答)
  decode_protocols:
    uart: RS232
    i2c: IIC
    spi: SPI
    can: CAN
    lin: LIN
    parallel: PARallel
  decode_formats:
    hex: HEX
    ascii: ASCii
    dec: DEC
    bin: BIN
  # 信号発生(:SOURce<n>、ガイド3.25章)。MHO900は2ch・番号付き。DHO800/900は
  # 番号なし:SOURce(DGモジュール)で別方言のため未宣言。実機検証: mho98-afg.md
  # (:SOURce3 は1発でSCPIサーバーを沈黙させるため、afg_channels での範囲検証必須)
  afg_prefix: ":SOURce{n}"
  afg_waveforms:
    sine: SINusoid
    square: SQUare
    ramp: RAMP
    noise: NOISe
    dc: DC
    arb: ARB
    exp_rise: EXPRise
    exp_fall: EXPFall
    ecg: ECG1
    gaussian: GAUSsian
    lorentz: LORentz
    haversine: HAVersine
    sinc: SINC
    # PULSe はガイドにもファームにも無い(送ると -222。mho98-afg.md 2章)
  afg_impedances:
    highz: OMEG
    "50": FIFTy
  # 変調(ガイド3.25.15-25)。変調ソースは内蔵のみ(EXTernalは存在しない)
  afg_mod_types: {am: AM, fm: FM, pm: PM}
  afg_mod_waveforms:
    sine: SINusoid
    square: SQUare
    triangle: TRIangle
    upramp: UPRamp
    dnramp: DNRamp
    noise: NOISe
  # オプション照会(MHO900専用。DHO800/900には存在しない)。実機検証:
  # docs/verification/mho98-unlicensed.md。*OPT? はRigol全シリーズで未定義
  # ヘッダ(送るとSCPIサーバーが沈黙)なので絶対に使わない。<type>リスト外の
  # トークンも同様に沈黙する — 下記11個以外を送らないこと
  option_query: ":SYSTem:OPTion:STATus?"
  option_types:
    bundle: BND
    afg_100mhz: AFG100
    afg_50mhz: AFG50
    audio_i2s: AUDio
    can_fd: CAN-FD
    flexray: FLEX
    mil_std_1553: AERO
    memory_500mpts: RLU-05
    bandwidth_350_to_500: BWU03T05
    bandwidth_350_to_800: BWU03T08
    bandwidth_500_to_800: BWU05T08
  waveform_preamble:
    # yorigin はここに持たない。定数ではなく設定依存の動的値であり、
    # チャンネルoffsetの生カウント換算(= offset / yincrement)で決まる
    # (実測: offset -0.064 V のとき yorigin=-9.0)。
    # 電圧変換には必ずライブの :WAVeform:PREamble? の値を使うこと。
    yreference: 128
  nr3_single_digit_exponent: true
  snaps_to_125: false
  invalid_query_behavior: silent_timeout # + error queue に -100
  error_queue_stale_on_connect: true

limits:
  probe_ratio: [0.001, 0.01, 0.1, 1, 10, 100, 1000, 10000] # 要実機確認
  # vertical_scale / timebase_scale 等は未検証 → 実機read-backフォールバック
