# 検証済みプロファイル: MHO98(docs/device-profiles.md 3章)
# 実測根拠: docs/verification/mho98-phase0.md(firmware 00.01.00)
model: MHO98
match: "^MHO9[0-9]" # IDNモデル文字列の一致規則(完全一致系)
inherits: rigol-generic
confidence: verified

capabilities:
  analog_channels: 4
  digital_channels: 16
  afg_channels: 2
  math_channels: 4 # ガイド3.16(<n> = 1〜4)
  ref_channels: 10 # ガイド3.16.3(SOURce範囲のREF1〜REF10)
  protocol_decode: true
  decode_buses: 4 # :BUS1〜:BUS4(実測: :BUS4:MODE? まで応答、:BUS5 は沈黙)
  waveform_download: true
  screenshot: true
  impedance_control: true # :CHANnel<n>:IMPedance が使える(問い合わせ含む)
  impedance_50ohm: true
  cursor: true # ガイド3.8(:CURSor。XYサブツリーを除く)
  frequency_counter: true # ガイド3.7(:COUNter)
  dvm: true # ガイド3.10(:DVM)
  histogram: true # ガイド3.11(:HISTogram。SAVE:CSVを除く)
  measurements: [
     frequency, period, rise_time, fall_time, pulse_width_pos, pulse_width_neg, duty,
    duty_neg, time_at_vmax, time_at_vmin, vpp, vmax, vmin, vtop, vbase, vamp, vupper,
    vmid, vlower, vavg, rms, period_rms, ac_rms, overshoot, preshoot, area, period_area,
    slew_rate_pos, slew_rate_neg, pulses_pos, pulses_neg, edges_pos, edges_neg,
    delay_rise_rise, delay_rise_fall, delay_fall_rise, delay_fall_fall, phase_rise_rise,
    phase_rise_fall, phase_fall_rise, phase_fall_fall
  ]

dialect:
  screenshot_command: ":DISPlay:DATA?"
  screenshot_timeout_s: 30 # 約97KBの転送猶予(通常問い合わせの5秒では足りない)
  bwlimit_on: "20M" # 帯域制限「入」の値(選択肢 OFF/20M/100M/250M は要実機確認)
  # オートセットアップ(ガイド3.2.1)。:AUToscale ではない(MHO900では
  # :SYSTem:AUToscale というAUTOキー有効化スイッチしか存在しない)。
  # サブツリー実在は読み取りプローブで実機確認済み(mho98-autoset.md)。
  # autoset書き込み自体は実機実行禁止のため未検証
  autoset_command: ":AUToset"
  # Resultビューの全測定項目を消す(ガイド3.17.3、引数なし・全消しのみ)。実機検証:
  # docs/verification/mho98-measure-clear.md。DHO800/900系は同義の :MEASure:CLEar
  # (ニモニックがファミリで分岐するためdialect化。MHO98実機は両方受理する)
  measurement_clear: ":MEASure:DELete"
  measurement_items:
    frequency: FREQuency
    period: PERiod
    rise_time: RTIMe
    fall_time: FTIMe
    pulse_width_pos: PWIDth
    pulse_width_neg: NWIDth
    duty: PDUTy # 返却単位は比率(0.5002 = 50.02%)
    duty_neg: NDUTy # 比率
    time_at_vmax: TVMAX
    time_at_vmin: TVMIN
    vpp: VPP
    vmax: VMAX
    vmin: VMIN
    vtop: VTOP
    vbase: VBASe
    vamp: VAMP
    vupper: VUPPer
    vmid: VMID
    vlower: VLOWer
    vavg: VAVG # VAVerage は不可(実測)
    rms: VRMS
    period_rms: PVRMs
    ac_rms: ACRMs
    overshoot: OVERshoot # 比率
    preshoot: PREShoot # 比率
    area: MARea # 単位 V*s(ガイド Other Parameters)
    period_area: MPARea # 単位 V*s
    slew_rate_pos: PSLewrate # 単位 V/s
    slew_rate_neg: NSLewrate # 単位 V/s
    pulses_pos: PPULses # 整数カウント
    pulses_neg: NPULses
    edges_pos: PEDGes
    edges_neg: NEDGes
    delay_rise_rise: RRDelay # ここから8項目は**2ソース必須**(ガイド3.17.2)
    delay_rise_fall: RFDelay
    delay_fall_rise: FRDelay
    delay_fall_fall: FFDelay
    phase_rise_rise: RRPHase
    phase_rise_fall: RFPHase
    phase_fall_rise: FRPHase
    phase_fall_fall: FFPHase
  # 測定の前提設定と統計(ガイド3.17.6/3.17.8/3.17.17/3.17.19/3.17.28-30)。
  # 未宣言なら configure_measurement / get_measurement_statistics は送信ゼロで
  # UNSUPPORTED_FEATURE。DHO系は実機未検証のため意図的に不在。
  measure_areas: # ガイド3.17.19
    main: MAIN
    zoom: ZOOM # 遅延掃引を先に有効化しないと機器が拒否する(同節Remark)
    cursor: CURSor
  measure_threshold_types: # ガイド3.17.17
    percent: PERCent
    absolute: ABSolute
  measure_amp_types: # ガイド3.17.28
    auto: AUTO
    manual: MANual
  measure_amp_methods: # ガイド3.17.29/3.17.30(TOP / BASE 共通の値域)
    histogram: HISTogram
    maxmin: MAXMin
  measure_statistic_types: # ガイド3.17.8 の <type>
    maximum: MAXimum
    minimum: MINimum
    current: CURRent
    average: AVERages
    deviation: DEViation
    count: CNT
  # シリアルデコード(:BUS<n>:MODE の値)。標準搭載6種のみ。
  # i2s(IIS)/ flexray / m1553(AERO)/ CAN-FD はライセンスオプション必須の
  # ため意図的に不在 — **不在がそのままゲート**(4.2の原則)。
  # 実機検証: docs/verification/mho98-unlicensed.md 3章(未ライセンス状態で
  # RS232/IIC/SPI/CAN/LIN/PAR の読み書きが全て正常応答)
  decode_protocols:
    uart: RS232
    i2c: IIC
    spi: SPI
    can: CAN
    lin: LIN
    parallel: PARallel
  decode_formats:
    hex: HEX
    ascii: ASCii
    dec: DEC
    bin: BIN
  # 信号発生(:SOURce<n>、ガイド3.25章)。MHO900は2ch・番号付き。DHO800/900は
  # 番号なし:SOURce(DGモジュール)で別方言のため未宣言。実機検証: mho98-afg.md
  # (:SOURce3 は1発でSCPIサーバーを沈黙させるため、afg_channels での範囲検証必須)
  afg_prefix: ":SOURce{n}"
  afg_waveforms:
    sine: SINusoid
    square: SQUare
    ramp: RAMP
    noise: NOISe
    dc: DC
    arb: ARB
    exp_rise: EXPRise
    exp_fall: EXPFall
    ecg: ECG1
    gaussian: GAUSsian
    lorentz: LORentz
    haversine: HAVersine
    sinc: SINC
    # PULSe はガイドにもファームにも無い(送ると -222。mho98-afg.md 2章)
  afg_impedances:
    highz: OMEG
    "50": FIFTy
  # 変調(ガイド3.25.15-25)。変調ソースは内蔵のみ(EXTernalは存在しない)
  afg_mod_types: {am: AM, fm: FM, pm: PM}
  afg_mod_waveforms:
    sine: SINusoid
    square: SQUare
    triangle: TRIangle
    upramp: UPRamp
    dnramp: DNRamp
    noise: NOISe
  # MATH演算(:MATH<n>、ガイド3.16章)。`:MATH<n>` にファミリ分岐の実例が無いため
  # 接頭辞はドライバ側のハードコードとし、範囲は capabilities.math_channels で
  # ゲートする。DHO800/900系は別ガイドの逐語解読が済んでいないため未宣言。
  # MATH演算子(ガイド3.16.2 :MATH<n>:OPERator)
  math_operators:
    add: ADD
    subtract: SUBTract
    multiply: MULTiply
    divide: DIVision
    and: AND
    or: OR
    xor: XOR
    not: NOT
    fft: FFT
    integrate: INTG
    differentiate: DIFF
    sqrt: SQRT
    log10: LG
    ln: LN
    exp: EXP
    abs: ABS
    lowpass: LPASs
    highpass: HPASs
    bandpass: BPASs
    bandstop: BSTop
    axb: AXB
  # FFTの窓関数(ガイド3.16.15 :MATH<n>:FFT:WINDow)
  math_fft_windows:
    rectangle: RECTangle
    blackman: BLACkman
    hanning: HANNing
    hamming: HAMMing
    flattop: FLATtop
    triangle: TRIangle
  # FFTの縦軸単位(ガイド3.16.16 :MATH<n>:FFT:UNIT)
  math_fft_units: {vrms: VRMS, db: DB}
  # FFTの演算モード(ガイド3.16.17 :MATH<n>:FFT:MODE)
  math_fft_modes: {normal: NORMal, average: AVERage, maxhold: MAXHold}
  # FFTピーク探索の並び順(ガイド3.16.29 :MATH<n>:FFT:SEARch:ORDer)
  math_fft_search_orders: {amplitude: AMPorder, frequency: FREQorder}
  # デジタルフィルタ(ガイド3.16.31 :MATH<n>:FILTer:TYPE)
  math_filter_types: {lowpass: LPASs, highpass: HPASs, bandpass: BPASs, bandstop: BSTop}
  # カーソル測定(ガイド3.8.1 :CURSor:MODE)。`xy` は水平時間軸がXYのときのみ
  # 有効(:CURSor:XY:* サブツリー自体はM2スコープ外)。TUNit / VUNit は
  # ガイド本文がページ欠落で値域不明のため宣言しない
  # (YAML 1.1 では裸の off/OFF が真偽値になるため引用符が必須)
  cursor_modes: {"off": "OFF", manual: MANual, track: TRACk, xy: XY}
  # カーソルの種別(ガイド3.8.2 :CURSor:MANual:TYPE)
  cursor_types: {time: TIME, amplitude: AMPLitude}
  # 周波数カウンタの測定モード(ガイド3.7.4 :COUNter:MODE)
  counter_modes: {frequency: FREQuency, period: PERiod, totalize: TOTalize}
  # 電圧計の測定モード(ガイド3.10.4 :DVM:MODE)。ACRMs=DC成分を除いた実効値 /
  # DC=平均 / DCRMs=実効値
  dvm_modes: {ac_rms: ACRMs, dc: DC, dc_rms: DCRMs}
  # ヒストグラムの種別(ガイド3.11.3 :HISTogram:TYPE)
  histogram_types: {horizontal: HORizontal, vertical: VERTical}
  # リファレンス波形の表示色(ガイド3.20.7 :REFerence:COLor)。枠数は
  # capabilities.ref_channels でゲートする(M1で宣言済み)。`:REFerence` は
  # 枠番号を**コマンド引数**で取るため接頭辞にファミリ分岐が無く、
  # ニモニック自体はドライバ側のハードコードとする
  reference_colors: {gray: GRAY, green: GREen, blue: BLUE, red: RED, orange: ORANge}
  # オプション照会(MHO900専用。DHO800/900には存在しない)。実機検証:
  # docs/verification/mho98-unlicensed.md。*OPT? はRigol全シリーズで未定義
  # ヘッダ(送るとSCPIサーバーが沈黙)なので絶対に使わない。<type>リスト外の
  # トークンも同様に沈黙する — 下記11個以外を送らないこと
  option_query: ":SYSTem:OPTion:STATus?"
  option_types:
    bundle: BND
    afg_100mhz: AFG100
    afg_50mhz: AFG50
    audio_i2s: AUDio
    can_fd: CAN-FD
    flexray: FLEX
    mil_std_1553: AERO
    memory_500mpts: RLU-05
    bandwidth_350_to_500: BWU03T05
    bandwidth_350_to_800: BWU03T08
    bandwidth_500_to_800: BWU05T08
  waveform_preamble:
    # yorigin はここに持たない。定数ではなく設定依存の動的値であり、
    # チャンネルoffsetの生カウント換算(= offset / yincrement)で決まる
    # (実測: offset -0.064 V のとき yorigin=-9.0)。
    # 電圧変換には必ずライブの :WAVeform:PREamble? の値を使うこと。
    yreference: 128
  nr3_single_digit_exponent: true
  snaps_to_125: false
  invalid_query_behavior: silent_timeout # + error queue に -100
  error_queue_stale_on_connect: true

limits:
  probe_ratio: [0.001, 0.01, 0.1, 1, 10, 100, 1000, 10000] # 要実機確認
  # vertical_scale / timebase_scale 等は未検証 → 実機read-backフォールバック
